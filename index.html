<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Restock BnB</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0ea; --card: #fff; --text: #1a1208; --muted: #8a7e6e;
    --accent: #e8572a; --green: #2a9e5a; --orange: #e88c2a;
    --border: #e4ddd3; --shadow: 0 4px 24px rgba(26,18,8,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: var(--text); color: var(--bg); padding: 18px 20px;
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; letter-spacing: -.02em; flex: 1; }
  .back-btn {
    background: rgba(255,255,255,.15); border: none; color: var(--bg); padding: 6px 14px;
    border-radius: 20px; font-family: 'DM Sans', sans-serif; font-size: .85rem; cursor: pointer;
    display: none; align-items: center; gap: 6px;
  }
  .back-btn.visible { display: flex; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* NAV */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--border); display: flex; z-index: 200;
    box-shadow: 0 -4px 20px rgba(26,18,8,.08);
  }
  .nav-btn {
    flex: 1; padding: 10px 4px 14px; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: 'DM Sans', sans-serif; font-size: .65rem; font-weight: 500;
    color: var(--muted); transition: color .15s; position: relative;
  }
  .nav-btn .nav-icon { font-size: 1.25rem; line-height: 1; }
  .nav-btn.active { color: var(--accent); }
  .nav-badge {
    position: absolute; top: 6px; right: calc(50% - 18px);
    background: var(--accent); color: #fff; border-radius: 10px;
    font-size: .6rem; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center;
    display: none;
  }
  .nav-badge.visible { display: block; }

  /* SHARED */
  .page-wrap { max-width: 500px; margin: 0 auto; padding: 20px 16px 100px; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 1.5rem; margin-bottom: 4px; }
  .page-sub { font-size: .85rem; color: var(--muted); margin-bottom: 20px; }
  .card-list { display: flex; flex-direction: column; gap: 10px; }

  /* APPART GRID */
  .appart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .appart-card {
    background: var(--card); border-radius: 16px; padding: 18px 14px; cursor: pointer;
    box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s;
    position: relative; overflow: hidden;
  }
  .appart-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--accent); transform: scaleX(0); transition: transform .18s;
  }
  .appart-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(26,18,8,.14); }
  .appart-card:hover::before { transform: scaleX(1); }
  .appart-card:active { transform: scale(.97); }
  .appart-icon { font-size: 2rem; margin-bottom: 10px; display: block; }
  .appart-name { font-weight: 600; font-size: 1rem; }
  .appart-meta { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .appart-need { font-size: .78rem; color: var(--accent); font-weight: 600; margin-top: 4px; }
  .appart-ok   { font-size: .78rem; color: var(--green); margin-top: 4px; }
  .appart-ts   { font-size: .7rem; color: var(--muted); margin-top: 5px; opacity: .8; }

  /* QTY ROW */
  .qty-row {
    background: var(--card); border-radius: 14px; padding: 13px 16px;
    display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
  }
  .qty-row-name { flex: 1; font-weight: 500; font-size: .95rem; }
  .qty-row-sub  { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; font-size: 1.2rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: 700; transition: transform .1s; line-height: 1;
  }
  .qty-btn:active { transform: scale(.88); }
  .btn-reset {
    width: 28px; height: 28px; border-radius: 50%; border: none; font-size: .8rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: #f0ebe4; color: var(--muted); transition: transform .1s, background .15s; flex-shrink: 0;
  }
  .btn-reset:active { transform: scale(.88); }
  .btn-reset.active { background: #fde8e0; color: var(--accent); }
  .btn-minus { background: #fde8e0; color: var(--accent); }
  .btn-plus  { background: #e0f5eb; color: var(--green); }
  .qty-val { min-width: 28px; text-align: center; font-size: 1.1rem; font-weight: 700; transition: transform .15s; }
  .qty-val.zero { color: #ccc; }
  .qty-val.has  { color: var(--accent); }
  .qty-val.good { color: var(--green); }

  /* DETAIL HEADER */
  .detail-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
  }
  .detail-icon {
    font-size: 2.4rem; width: 52px; height: 52px; background: var(--card);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); flex-shrink: 0;
  }
  .detail-info h2 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; }
  .detail-info p  { font-size: .85rem; color: var(--muted); margin-top: 2px; }
  .detail-info .ts { font-size: .75rem; color: var(--muted); margin-top: 2px; opacity: .8; }

  /* À ACHETER */
  .acheter-section-title {
    font-size: .75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin: 20px 0 10px; padding-left: 2px;
  }
  .acheter-item {
    background: var(--card); border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
  }
  .acheter-item-name { flex: 1; font-weight: 500; font-size: .95rem; }
  .acheter-item-detail { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .acheter-badge {
    font-size: 1rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; flex-shrink: 0;
  }
  .badge-buy  { background: #fde8e0; color: var(--accent); }
  .badge-ok   { background: #e0f5eb; color: var(--green); }

  .tab-switcher {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1; padding: 9px; border-radius: 10px; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: .85rem; font-weight: 500;
    background: var(--card); color: var(--muted); box-shadow: var(--shadow);
    transition: background .15s, color .15s;
  }
  .tab-btn.active { background: var(--text); color: var(--bg); }

  .empty-state {
    text-align: center; padding: 48px 20px; color: var(--muted);
  }
  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }

  /* SETTINGS */
  .settings-section { margin-bottom: 28px; }
  .settings-section-title {
    font-size: .75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; padding-left: 4px;
  }
  .settings-list { display: flex; flex-direction: column; gap: 8px; }
  .settings-item {
    background: var(--card); border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow);
  }
  .drag-handle { font-size: 1.1rem; color: var(--border); cursor: grab; flex-shrink: 0; padding: 0 2px; user-select: none; }
  .settings-item-emoji { font-size: 1.5rem; cursor: pointer; flex-shrink: 0; }
  .settings-item-input {
    flex: 1; border: none; background: none; font-family: 'DM Sans', sans-serif;
    font-size: .95rem; font-weight: 500; color: var(--text); outline: none; min-width: 0;
    border-bottom: 2px solid transparent; transition: border-color .2s;
  }
  .settings-item-input:focus { border-bottom-color: var(--accent); }
  .settings-delete-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none; background: #fde8e0;
    color: var(--accent); cursor: pointer; font-size: 1.1rem; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .settings-item.dragging { opacity: .4; }
  .settings-item.drag-over { border: 2px solid var(--accent); background: #fef6f3; }
  .add-btn {
    width: 100%; padding: 13px; border-radius: 12px; border: 2px dashed var(--border);
    background: none; font-family: 'DM Sans', sans-serif; font-size: .9rem;
    color: var(--muted); cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 8px; margin-top: 8px;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .save-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--text);
    color: var(--bg); font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  .io-btn {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border-radius: 14px; border: none; cursor: pointer; width: 100%;
    font-family: 'DM Sans', sans-serif; font-size: .95rem; text-align: left;
    box-shadow: var(--shadow); margin-bottom: 10px;
  }
  .export-btn { background: var(--text); color: var(--bg); }
  .import-btn { background: var(--card); color: var(--text); }

  /* EMOJI MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .emoji-picker {
    background: var(--card); border-radius: 20px 20px 0 0;
    padding: 20px 16px 40px; width: 100%; max-width: 500px;
  }
  .emoji-picker h3 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; margin-bottom: 14px; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .emoji-opt {
    width: 44px; height: 44px; border-radius: 10px; border: 2px solid transparent;
    background: var(--bg); font-size: 1.4rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .emoji-opt:hover { border-color: var(--accent); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 70px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text); color: var(--bg); padding: 10px 20px;
    border-radius: 24px; font-size: .85rem; font-weight: 500;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 999; pointer-events: none; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  @media (max-width: 360px) { .appart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="back-btn" id="back-btn">← Retour</button>
  <h1 id="header-title">🏠 Besoins</h1>
</header>

<!-- BESOINS HOME -->
<div class="screen active" id="screen-besoins">
  <div class="page-wrap">
    <p class="page-title">Besoins</p>
    <p class="page-sub">Ce qui manque dans chaque appartement</p>
    <div class="appart-grid" id="besoins-grid"></div>
  </div>
</div>

<!-- BESOIN DETAIL -->
<div class="screen" id="screen-besoin-detail">
  <div class="page-wrap">
    <div class="detail-header">
      <div class="detail-icon" id="bd-icon"></div>
      <div class="detail-info">
        <h2 id="bd-title"></h2>
        <p id="bd-sub"></p>
        <p class="ts" id="bd-ts"></p>
      </div>
    </div>
    <div class="card-list" id="bd-list"></div>
  </div>
</div>

<!-- STOCK CENTRAL -->
<div class="screen" id="screen-stock">
  <div class="page-wrap">
    <p class="page-title">Stock central</p>
    <p class="page-sub" id="stock-sub">Tes réserves disponibles</p>
    <div class="card-list" id="stock-list"></div>
  </div>
</div>

<!-- À ACHETER -->
<div class="screen" id="screen-acheter">
  <div class="page-wrap">
    <p class="page-title">À acheter</p>
    <p class="page-sub" id="acheter-sub"></p>
    <div class="tab-switcher">
      <button class="tab-btn active" id="tab-produit" onclick="switchTab('produit')">Par produit</button>
      <button class="tab-btn" id="tab-appart" onclick="switchTab('appart')">Par appartement</button>
    </div>
    <div id="acheter-content"></div>
  </div>
</div>

<!-- SETTINGS -->
<div class="screen" id="screen-settings">
  <div class="page-wrap">
    <div class="settings-section">
      <p class="settings-section-title">Appartements</p>
      <div class="settings-list" id="settings-apparts"></div>
      <button class="add-btn" onclick="addAppart()">+ Ajouter un appartement</button>
    </div>
    <div class="settings-section">
      <p class="settings-section-title">Produits</p>
      <div class="settings-list" id="settings-produits"></div>
      <button class="add-btn" onclick="addProduit()">+ Ajouter un produit</button>
    </div>
    <button class="save-btn" onclick="saveSettings()">✅ Enregistrer les modifications</button>
    <div class="settings-section" style="margin-top:28px;">
      <p class="settings-section-title">Synchronisation</p>
      <button class="io-btn export-btn" onclick="exportData()">
        <span style="font-size:1.3rem;">📤</span>
        <div><div style="font-weight:600;">Exporter mes données</div>
        <div style="font-size:.78rem;opacity:.7;margin-top:2px;">Télécharge un fichier .json</div></div>
      </button>
      <label class="io-btn import-btn" for="import-input">
        <span style="font-size:1.3rem;">📥</span>
        <div><div style="font-weight:600;">Importer des données</div>
        <div style="font-size:.78rem;opacity:.7;margin-top:2px;">Charge un fichier .json</div></div>
      </label>
      <input type="file" id="import-input" accept=".json" style="display:none;" onchange="importData(event)">
    </div>
  </div>
</div>

<!-- EMOJI MODAL -->
<div class="modal-overlay" id="emoji-modal" onclick="closeEmojiPicker(event)">
  <div class="emoji-picker">
    <h3>Choisir une icône</h3>
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="nav-bar">
  <button class="nav-btn active" id="nav-besoins" onclick="showBesoins()">
    <span class="nav-icon">🏠</span><span>Besoins</span>
  </button>
  <button class="nav-btn" id="nav-stock" onclick="showStock()">
    <span class="nav-icon">📦</span><span>Stock</span>
  </button>
  <button class="nav-btn" id="nav-acheter" onclick="showAcheter()">
    <span class="nav-badge" id="badge-acheter"></span>
    <span class="nav-icon">🛒</span><span>À acheter</span>
  </button>
  <button class="nav-btn" id="nav-settings" onclick="showSettings()">
    <span class="nav-icon">⚙️</span><span>Réglages</span>
  </button>
</nav>

<script>
// ── STORAGE ───────────────────────────────────────────────────────────────────
const KEY_APPARTS    = 'rnb_apparts_v1';
const KEY_PRODUITS   = 'rnb_produits_v1';
const KEY_BESOINS    = 'rnb_besoins_v1';    // { appartId: { produit: qty } }
const KEY_STOCK      = 'rnb_stock_v1';      // { produit: qty }
const KEY_TIMESTAMPS = 'rnb_timestamps_v1'; // { appartId: ISO }

const DEFAULT_APPARTS = [
  { id:'A', name:'Appart A', emoji:'🏡' },
  { id:'B', name:'Appart B', emoji:'🛖' },
  { id:'C', name:'Appart C', emoji:'🏢' },
  { id:'D', name:'Appart D', emoji:'🏠' },
  { id:'E', name:'Appart E', emoji:'🏗️' },
];
const DEFAULT_PRODUITS = [
  'PQ','Sopalin','Gel douche','Shampoing','Savon mains',
  'Éponges','Liquide vaisselle','Sacs poubelles grands',
  'Sacs poubelles petits','Produit vitres','Anti calcaire',
  'Javel','Café','Thé',"Huile d'olive"
];
const EMOJIS = ['🏠','🏡','🏢','🏣','🏤','🏥','🏦','🏨','🏩','🏪','🏫','🏬','🏭','🏯','🏰','🛖','🗼','🗽','⛪','🕌','🕍','🛕','⛩️','🏗️','🏘️','🌆','🌇','🌃','🌉','🌁','🌄','🗺️','🔑','🪙','💎','⭐','🌟','🎯','🎪','🎨'];

function load(key, def) {
  try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {}
  return JSON.parse(JSON.stringify(def));
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let apparts    = load(KEY_APPARTS,    DEFAULT_APPARTS);
let produits   = load(KEY_PRODUITS,   DEFAULT_PRODUITS);
let besoins    = load(KEY_BESOINS,    {});
let stockC     = load(KEY_STOCK,      {});
let timestamps = load(KEY_TIMESTAMPS, {});

// Sync structures
function syncAll() {
  for (const ap of apparts) {
    if (!besoins[ap.id]) besoins[ap.id] = {};
    for (const p of produits) {
      if (besoins[ap.id][p] === undefined) besoins[ap.id][p] = 0;
    }
  }
  for (const p of produits) {
    if (stockC[p] === undefined) stockC[p] = 0;
  }
  save(KEY_BESOINS, besoins);
  save(KEY_STOCK,   stockC);
}
syncAll();

let currentAppart  = null;
let currentTab     = 'produit';
let editApparts    = [], editProduits = [], emojiTarget = null;
let dragSrc        = null;

// ── UTILS ─────────────────────────────────────────────────────────────────────
function safeid(s) { return s.replace(/[^a-z0-9]/gi,'_'); }

function formatTimestamp(iso) {
  if (!iso) return 'Jamais modifié';
  const d = new Date(iso);
  const diffMs  = Date.now() - d;
  const diffMin = Math.floor(diffMs / 60000);
  const diffH   = Math.floor(diffMs / 3600000);
  const diffD   = Math.floor(diffMs / 86400000);
  if (diffMin < 1)  return 'À l\'instant';
  if (diffMin < 60) return `Il y a ${diffMin} min`;
  if (diffH < 24)   return `Il y a ${diffH}h`;
  if (diffD === 1)  return 'Hier ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

// Total besoin pour un produit (tous apparts)
function totalBesoin(produit) {
  return apparts.reduce((s, ap) => s + (besoins[ap.id]?.[produit] || 0), 0);
}

// Quantité à acheter pour un produit = max(0, totalBesoin - stock)
function qtyAcheter(produit) {
  return Math.max(0, totalBesoin(produit) - (stockC[produit] || 0));
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function setNav(active) {
  ['besoins','stock','acheter','settings'].forEach(id =>
    document.getElementById('nav-'+id).classList.toggle('active', id===active));
}

function hideAll() {
  ['besoins','besoin-detail','stock','acheter','settings'].forEach(id =>
    document.getElementById('screen-'+id).classList.remove('active'));
  document.getElementById('back-btn').classList.remove('visible');
}

document.getElementById('back-btn').onclick = function() {
  if (currentAppart) { currentAppart = null; showBesoins(); }
  else showBesoins();
};

function updateBadge() {
  const total = produits.filter(p => qtyAcheter(p) > 0).length;
  const b = document.getElementById('badge-acheter');
  b.textContent = total;
  b.classList.toggle('visible', total > 0);
}

// ── BESOINS HOME ──────────────────────────────────────────────────────────────
function showBesoins() {
  editApparts = []; editProduits = [];
  currentAppart = null;
  hideAll();
  document.getElementById('screen-besoins').classList.add('active');
  document.getElementById('header-title').textContent = '🏠 Besoins';
  setNav('besoins'); renderBesoinsHome(); updateBadge();
}

function renderBesoinsHome() {
  const grid = document.getElementById('besoins-grid');
  grid.innerHTML = '';
  for (const ap of apparts) {
    const b = besoins[ap.id] || {};
    const nbBesoin = produits.filter(p => b[p] > 0).length;
    const totalQty = produits.reduce((s,p) => s+(b[p]||0), 0);
    const card = document.createElement('div');
    card.className = 'appart-card';
    card.innerHTML = `
      <span class="appart-icon">${ap.emoji}</span>
      <div class="appart-name">${ap.name}</div>
      <div class="appart-meta">${produits.length} produits</div>
      ${nbBesoin > 0
        ? `<div class="appart-need">🔴 ${nbBesoin} produit${nbBesoin>1?'s':''} · ${totalQty} unité${totalQty>1?'s':''}</div>`
        : `<div class="appart-ok">✓ Rien ne manque</div>`}
      <div class="appart-ts">🕐 ${formatTimestamp(timestamps[ap.id])}</div>`;
    card.onclick = () => showBesoinDetail(ap.id);
    grid.appendChild(card);
  }
}

// ── BESOIN DETAIL ─────────────────────────────────────────────────────────────
function showBesoinDetail(appartId) {
  const ap = apparts.find(a => a.id === appartId); if (!ap) return;
  currentAppart = appartId;
  hideAll();
  document.getElementById('screen-besoin-detail').classList.add('active');
  document.getElementById('back-btn').classList.add('visible');
  document.getElementById('header-title').textContent = ap.name;
  document.getElementById('bd-icon').textContent = ap.emoji;
  document.getElementById('bd-title').textContent = ap.name;
  document.getElementById('bd-ts').textContent = '🕐 ' + formatTimestamp(timestamps[appartId]);
  setNav('besoins'); renderBesoinDetail(appartId);
}

function renderBesoinDetail(appartId) {
  const b    = besoins[appartId] || {};
  const list = document.getElementById('bd-list');
  list.innerHTML = '';
  for (const p of produits) {
    const qty = b[p] || 0;
    const el  = document.createElement('div');
    el.className = 'qty-row';
    const ps  = p.replace(/'/g,"\\'");
    el.innerHTML = `
      <div style="flex:1;">
        <div class="qty-row-name">${p}</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn btn-reset ${qty>0?'active':''}" id="br-${safeid(p)}" onclick="resetBesoin('${appartId}','${ps}')" title="Remettre à 0">↺</button>
        <button class="qty-btn btn-minus" onclick="updateBesoin('${appartId}','${ps}',-1)">−</button>
        <span class="qty-val ${qty===0?'zero':'has'}" id="bq-${safeid(p)}">${qty}</span>
        <button class="qty-btn btn-plus"  onclick="updateBesoin('${appartId}','${ps}',+1)">+</button>
      </div>`;
    list.appendChild(el);
  }
  updateBesoinSub(appartId);
}

function updateBesoinSub(appartId) {
  const b = besoins[appartId]||{};
  const nb = produits.filter(p=>b[p]>0).length;
  const total = produits.reduce((s,p)=>s+(b[p]||0),0);
  document.getElementById('bd-sub').textContent =
    nb > 0 ? `${nb} produit${nb>1?'s':''} manquant${nb>1?'s':''} · ${total} unité${total>1?'s':''}` : 'Rien ne manque';
}

function resetBesoin(appartId, produit) {
  if (!besoins[appartId] || besoins[appartId][produit] === 0) return;
  besoins[appartId][produit] = 0;
  timestamps[appartId] = new Date().toISOString();
  save(KEY_BESOINS, besoins);
  save(KEY_TIMESTAMPS, timestamps);
  const el = document.getElementById(`bq-${safeid(produit)}`);
  if (el) { el.textContent = 0; el.className = 'qty-val zero'; }
  const br = document.getElementById(`br-${safeid(produit)}`);
  if (br) br.classList.remove('active');
  document.getElementById('bd-ts').textContent = '🕐 ' + formatTimestamp(timestamps[appartId]);
  updateBesoinSub(appartId);
  updateBadge();
  showToast('↺ Remis à 0');
}

function updateBesoin(appartId, produit, delta) {
  if (!besoins[appartId]) besoins[appartId] = {};
  const cur  = besoins[appartId][produit] || 0;
  const next = Math.max(0, cur + delta);
  if (next === cur) { if (delta < 0) showToast('Déjà à 0 !'); return; }
  besoins[appartId][produit] = next;
  timestamps[appartId] = new Date().toISOString();
  save(KEY_BESOINS, besoins);
  save(KEY_TIMESTAMPS, timestamps);
  const el = document.getElementById(`bq-${safeid(produit)}`);
  if (el) {
    el.textContent = next;
    el.className = 'qty-val ' + (next===0?'zero':'has');
    el.style.transform = 'scale(1.4)';
    setTimeout(() => el.style.transform = '', 150);
  }
  const br = document.getElementById(`br-${safeid(produit)}`);
  if (br) br.classList.toggle('active', next > 0);
  document.getElementById('bd-ts').textContent = '🕐 ' + formatTimestamp(timestamps[appartId]);
  updateBesoinSub(appartId);
  updateBadge();
}

// ── STOCK CENTRAL ─────────────────────────────────────────────────────────────
function showStock() {
  editApparts = []; editProduits = [];
  hideAll();
  document.getElementById('screen-stock').classList.add('active');
  document.getElementById('header-title').textContent = '📦 Stock central';
  setNav('stock'); renderStock();
}

function renderStock() {
  const list = document.getElementById('stock-list');
  list.innerHTML = '';
  let totalUnits = 0;
  for (const p of produits) {
    const qty    = stockC[p] || 0;
    const besoin = totalBesoin(p);
    totalUnits  += qty;
    const el = document.createElement('div');
    el.className = 'qty-row';
    const ps = p.replace(/'/g,"\\'");
    el.innerHTML = `
      <div style="flex:1;">
        <div class="qty-row-name">${p}</div>
        <div class="qty-row-sub">Besoin total : ${besoin}</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn btn-minus" onclick="updateStock('${ps}',-1)">−</button>
        <span class="qty-val ${qty===0?'zero':qty>=besoin?'good':'has'}" id="sq-${safeid(p)}">${qty}</span>
        <button class="qty-btn btn-plus"  onclick="updateStock('${ps}',+1)">+</button>
      </div>`;
    list.appendChild(el);
  }
  const nb = produits.filter(p=>(stockC[p]||0)>0).length;
  document.getElementById('stock-sub').textContent =
    nb > 0 ? `${nb} produit${nb>1?'s':''} en stock · ${totalUnits} unité${totalUnits>1?'s':''}` : 'Stock vide';
}

function updateStock(produit, delta) {
  const cur  = stockC[produit] || 0;
  const next = Math.max(0, cur + delta);
  if (next === cur) { if (delta < 0) showToast('Déjà à 0 !'); return; }
  stockC[produit] = next;
  save(KEY_STOCK, stockC);
  const besoin = totalBesoin(produit);
  const el = document.getElementById(`sq-${safeid(produit)}`);
  if (el) {
    el.textContent = next;
    el.className = 'qty-val ' + (next===0?'zero':next>=besoin?'good':'has');
    el.style.transform = 'scale(1.4)';
    setTimeout(() => el.style.transform = '', 150);
  }
  // Update sub text
  const nb = produits.filter(p=>(stockC[p]||0)>0).length;
  const total = produits.reduce((s,p)=>s+(stockC[p]||0),0);
  document.getElementById('stock-sub').textContent =
    nb > 0 ? `${nb} produit${nb>1?'s':''} en stock · ${total} unité${total>1?'s':''}` : 'Stock vide';
  updateBadge();
}

// ── À ACHETER ─────────────────────────────────────────────────────────────────
function showAcheter() {
  editApparts = []; editProduits = [];
  hideAll();
  document.getElementById('screen-acheter').classList.add('active');
  document.getElementById('header-title').textContent = '🛒 À acheter';
  setNav('acheter'); renderAcheter(); updateBadge();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-produit').classList.toggle('active', tab==='produit');
  document.getElementById('tab-appart').classList.toggle('active', tab==='appart');
  renderAcheter();
}

function renderAcheter() {
  const content = document.getElementById('acheter-content');
  content.innerHTML = '';

  const toShop = produits.filter(p => qtyAcheter(p) > 0);
  const ok     = produits.filter(p => qtyAcheter(p) === 0 && totalBesoin(p) > 0);

  const totalItems = toShop.length;
  const totalUnits = toShop.reduce((s,p) => s+qtyAcheter(p), 0);
  document.getElementById('acheter-sub').textContent =
    totalItems > 0
      ? `${totalItems} produit${totalItems>1?'s':''} à acheter · ${totalUnits} unité${totalUnits>1?'s':''}`
      : 'Tout est couvert par le stock 🎉';

  if (totalBesoin(produits[0]) === 0 && produits.every(p => totalBesoin(p) === 0)) {
    content.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✅</div>
      <p>Aucun besoin enregistré.<br>Va dans Besoins pour indiquer ce qui manque.</p>
    </div>`;
    return;
  }

  if (currentTab === 'produit') {
    renderAcheterParProduit(content, toShop, ok);
  } else {
    renderAcheterParAppart(content);
  }
}

function renderAcheterParProduit(container, toShop, ok) {
  if (toShop.length > 0) {
    const title = document.createElement('div');
    title.className = 'acheter-section-title';
    title.textContent = `À acheter (${toShop.length})`;
    container.appendChild(title);
    for (const p of toShop) {
      const qty    = qtyAcheter(p);
      const besoin = totalBesoin(p);
      const stock  = stockC[p] || 0;
      const detail = apparts
        .filter(ap => (besoins[ap.id]?.[p]||0) > 0)
        .map(ap => `${ap.name}: ${besoins[ap.id][p]}`)
        .join(' · ');
      const el = document.createElement('div');
      el.className = 'acheter-item';
      el.innerHTML = `
        <div style="flex:1;">
          <div class="acheter-item-name">${p}</div>
          <div class="acheter-item-detail">Besoin: ${besoin} · Stock: ${stock} · ${detail}</div>
        </div>
        <span class="acheter-badge badge-buy">× ${qty}</span>`;
      container.appendChild(el);
    }
  }

  if (ok.length > 0) {
    const title2 = document.createElement('div');
    title2.className = 'acheter-section-title';
    title2.textContent = `Couvert par le stock (${ok.length})`;
    container.appendChild(title2);
    for (const p of ok) {
      const besoin = totalBesoin(p);
      const stock  = stockC[p] || 0;
      const el = document.createElement('div');
      el.className = 'acheter-item';
      el.style.opacity = '.6';
      el.innerHTML = `
        <div style="flex:1;">
          <div class="acheter-item-name">${p}</div>
          <div class="acheter-item-detail">Besoin: ${besoin} · Stock: ${stock}</div>
        </div>
        <span class="acheter-badge badge-ok">✓</span>`;
      container.appendChild(el);
    }
  }
}

function renderAcheterParAppart(container) {
  for (const ap of apparts) {
    const b = besoins[ap.id] || {};
    const lines = produits.filter(p => b[p] > 0);
    if (lines.length === 0) continue;

    const title = document.createElement('div');
    title.className = 'acheter-section-title';
    title.textContent = `${ap.emoji} ${ap.name}`;
    container.appendChild(title);

    for (const p of lines) {
      const besoin = b[p] || 0;
      const stock  = stockC[p] || 0;
      // Portion du stock allouée à cet appart (proportionnelle)
      const totalB = totalBesoin(p);
      const stockPart = totalB > 0 ? Math.min(besoin, Math.round((besoin / totalB) * stock)) : 0;
      const toShop = Math.max(0, besoin - stockPart);
      const el = document.createElement('div');
      el.className = 'acheter-item';
      el.innerHTML = `
        <div style="flex:1;">
          <div class="acheter-item-name">${p}</div>
          <div class="acheter-item-detail">Besoin: ${besoin} · Stock alloué: ${stockPart}</div>
        </div>
        <span class="acheter-badge ${toShop>0?'badge-buy':'badge-ok'}">${toShop>0?'× '+toShop:'✓'}</span>`;
      container.appendChild(el);
    }
  }

  if (document.getElementById('acheter-content').children.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✅</div><p>Rien à acheter !</p>
    </div>`;
  }
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function showSettings() {
  hideAll();
  document.getElementById('screen-settings').classList.add('active');
  document.getElementById('header-title').textContent = '⚙️ Réglages';
  setNav('settings'); renderSettings();
}

function renderSettings() {
  if (editApparts.length === 0)  editApparts  = apparts.map(a=>({...a}));
  if (editProduits.length === 0) editProduits = [...produits];
  renderAppartsList(); renderProduitsList();
}

function renderAppartsList() {
  const al = document.getElementById('settings-apparts');
  al.innerHTML = '';
  editApparts.forEach((ap, i) => {
    const el = document.createElement('div');
    el.className = 'settings-item'; el.id = `edit-ap-${i}`;
    el.draggable = true; el.dataset.type = 'appart'; el.dataset.index = i;
    const handle = document.createElement('span');
    handle.className = 'drag-handle'; handle.textContent = '⠿';
    const emoji = document.createElement('span');
    emoji.className = 'settings-item-emoji'; emoji.textContent = ap.emoji;
    emoji.onclick = () => openEmojiPicker(i);
    const input = document.createElement('input');
    input.className = 'settings-item-input'; input.value = ap.name;
    input.placeholder = "Nom de l'appartement";
    input.oninput = () => { editApparts[i].name = input.value; };
    const del = document.createElement('button');
    del.className = 'settings-delete-btn'; del.textContent = '×';
    del.onclick = () => { if (editApparts.length<=1){showToast('Il faut au moins 1 appartement');return;} editApparts.splice(i,1); renderAppartsList(); };
    el.append(handle, emoji, input, del);
    addDragEvents(el, 'appart');
    al.appendChild(el);
  });
}

function renderProduitsList() {
  const pl = document.getElementById('settings-produits');
  pl.innerHTML = '';
  editProduits.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'settings-item'; el.id = `edit-pr-${i}`;
    el.draggable = true; el.dataset.type = 'produit'; el.dataset.index = i;
    const handle = document.createElement('span');
    handle.className = 'drag-handle'; handle.textContent = '⠿';
    const input = document.createElement('input');
    input.className = 'settings-item-input'; input.value = p;
    input.placeholder = 'Nom du produit';
    input.oninput = () => { editProduits[i] = input.value; };
    const del = document.createElement('button');
    del.className = 'settings-delete-btn'; del.textContent = '×';
    del.onclick = () => { if (editProduits.length<=1){showToast('Il faut au moins 1 produit');return;} editProduits.splice(i,1); renderProduitsList(); };
    el.append(handle, input, del);
    addDragEvents(el, 'produit');
    pl.appendChild(el);
  });
}

function addAppart() {
  editApparts.push({ id:'AP_'+Date.now(), name:'', emoji:'🏠' });
  renderAppartsList();
  setTimeout(()=>{ const el=document.querySelector(`#edit-ap-${editApparts.length-1} .settings-item-input`); if(el) el.focus(); },80);
}
function addProduit() {
  editProduits.push('');
  renderProduitsList();
  setTimeout(()=>{ const el=document.querySelector(`#edit-pr-${editProduits.length-1} .settings-item-input`); if(el) el.focus(); },80);
}

function saveSettings() {
  if (editApparts.some(a=>!a.name.trim()))  { showToast("Un appartement n'a pas de nom"); return; }
  if (editProduits.some(p=>!p.trim()))      { showToast("Un produit n'a pas de nom"); return; }

  const removedApparts  = apparts.filter(a=>!editApparts.find(ea=>ea.id===a.id)).map(a=>a.id);
  const removedProduits = produits.filter(p=>!editProduits.includes(p));

  for (const id of removedApparts) { delete besoins[id]; delete timestamps[id]; }
  for (const rp of removedProduits) {
    delete stockC[rp];
    for (const ap of editApparts) { if(besoins[ap.id]) delete besoins[ap.id][rp]; }
  }
  apparts  = editApparts.map(a=>({...a, name:a.name.trim()}));
  produits = editProduits.map(p=>p.trim());
  syncAll();

  save(KEY_APPARTS,    apparts);
  save(KEY_PRODUITS,   produits);
  save(KEY_BESOINS,    besoins);
  save(KEY_STOCK,      stockC);
  save(KEY_TIMESTAMPS, timestamps);

  editApparts = []; editProduits = [];
  showToast('✅ Modifications enregistrées !');
  setTimeout(()=>showBesoins(), 900);
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
function addDragEvents(el, type) {
  el.addEventListener('dragstart', e => {
    dragSrc = el;
    setTimeout(() => el.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    document.querySelectorAll('.settings-item').forEach(i=>i.classList.remove('drag-over'));
    dragSrc = null;
  });
  el.addEventListener('dragover', e => {
    e.preventDefault();
    if (dragSrc && dragSrc!==el && dragSrc.dataset.type===type) {
      document.querySelectorAll('.settings-item').forEach(i=>i.classList.remove('drag-over'));
      el.classList.add('drag-over');
    }
  });
  el.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragSrc||dragSrc===el||dragSrc.dataset.type!==type) return;
    const from=parseInt(dragSrc.dataset.index), to=parseInt(el.dataset.index);
    if (type==='appart') { const [x]=editApparts.splice(from,1); editApparts.splice(to,0,x); renderAppartsList(); }
    else                 { const [x]=editProduits.splice(from,1); editProduits.splice(to,0,x); renderProduitsList(); }
  });
  // Touch
  el.addEventListener('touchstart', e=>{dragSrc=el;el.classList.add('dragging');},{passive:true});
  el.addEventListener('touchmove', e=>{
    e.preventDefault();
    const t=e.touches[0], target=document.elementFromPoint(t.clientX,t.clientY)?.closest('.settings-item');
    document.querySelectorAll('.settings-item').forEach(i=>i.classList.remove('drag-over'));
    if(target&&target!==el&&target.dataset.type===type) target.classList.add('drag-over');
  },{passive:false});
  el.addEventListener('touchend', e=>{
    el.classList.remove('dragging');
    const t=e.changedTouches[0], target=document.elementFromPoint(t.clientX,t.clientY)?.closest('.settings-item');
    document.querySelectorAll('.settings-item').forEach(i=>i.classList.remove('drag-over'));
    if(target&&target!==el&&target.dataset.type===type){
      const from=parseInt(el.dataset.index), to=parseInt(target.dataset.index);
      if(type==='appart'){const[x]=editApparts.splice(from,1);editApparts.splice(to,0,x);renderAppartsList();}
      else{const[x]=editProduits.splice(from,1);editProduits.splice(to,0,x);renderProduitsList();}
    }
  });
}

// ── EMOJI ─────────────────────────────────────────────────────────────────────
function openEmojiPicker(idx) {
  emojiTarget = idx;
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = '';
  for (const e of EMOJIS) {
    const btn = document.createElement('button');
    btn.className='emoji-opt'; btn.textContent=e;
    btn.onclick=()=>pickEmoji(e);
    grid.appendChild(btn);
  }
  document.getElementById('emoji-modal').classList.add('open');
}
function pickEmoji(emoji) {
  if (emojiTarget!==null) {
    editApparts[emojiTarget].emoji=emoji;
    const el=document.querySelector(`#edit-ap-${emojiTarget} .settings-item-emoji`);
    if(el) el.textContent=emoji;
  }
  document.getElementById('emoji-modal').classList.remove('open'); emojiTarget=null;
}
function closeEmojiPicker(e) {
  if(e.target===document.getElementById('emoji-modal')){
    document.getElementById('emoji-modal').classList.remove('open'); emojiTarget=null;
  }
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────
function exportData() {
  const data = { version:4, exportedAt:new Date().toISOString(), apparts, produits, besoins, stock:stockC, timestamps };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`restock-bnb-${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('📤 Export téléchargé !');
}
function importData(event) {
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try {
      const data=JSON.parse(e.target.result);
      if(!data.apparts||!data.produits){showToast('❌ Fichier invalide');return;}
      if(!confirm(`Importer les données du ${new Date(data.exportedAt).toLocaleString('fr-FR')} ?\nTes données actuelles seront remplacées.`)) return;
      apparts=data.apparts; produits=data.produits;
      besoins=data.besoins||{}; stockC=data.stock||{}; timestamps=data.timestamps||{};
      save(KEY_APPARTS,apparts); save(KEY_PRODUITS,produits);
      save(KEY_BESOINS,besoins); save(KEY_STOCK,stockC); save(KEY_TIMESTAMPS,timestamps);
      showToast('📥 Données importées !');
      setTimeout(()=>showBesoins(),900);
    } catch(err){showToast('❌ Fichier illisible');}
  };
  reader.readAsText(file); event.target.value='';
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderBesoinsHome(); updateBadge();
